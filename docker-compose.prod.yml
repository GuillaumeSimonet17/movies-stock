services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - /var/www/monapp/static:/app/staticfiles
    command: gunicorn moviesstock.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:3000:80"
    restart: always

  db:
    image: postgres:16
    container_name: postgres_moviesstock
    restart: always
    env_file:
      - .env
    volumes:
      - moviesstock_postgres_data:/var/lib/postgresql/data

volumes:
  moviesstock_postgres_data:
    external: true
