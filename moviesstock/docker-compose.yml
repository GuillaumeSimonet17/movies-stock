services:
  db:
    image: postgres:16
    container_name: postgres_moviesstock
    restart: unless-stopped
    environment:
      POSTGRES_DB: moviesstock
      POSTGRES_USER: guillaume
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
